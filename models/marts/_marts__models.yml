version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      К заказу пристыкованы итоги по платежам; подтверждённая покупка — статус paid
      и хотя бы одна успешная оплата (возврат оплатой не считается).
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [paid, pending, returned, cancelled]
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
        data_tests: [not_null, non_negative]
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
        data_tests: [not_null, non_negative]
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
        data_tests: [not_null, non_negative]
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
        data_tests: [not_null]
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
        data_tests: [not_null, non_negative]
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]
      - name: items_count
        description: Число разных товаров.
        data_tests: [not_null, non_negative]

  - name: fct_order_items
    description: Одна строка - товар в нетестовом заказе.
    columns:
      - name: order_item_id
        description: Ключ заказа и товара.
        data_tests: [unique, not_null]
      - name: order_id
        description: Номер заказа.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: Номер товара.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: Номер клиента.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Дата заказа.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: quantity
        description: Количество.
        data_tests: [not_null, non_negative]
      - name: unit_price
        description: Цена за единицу.
        data_tests: [not_null, non_negative]
      - name: discount_amount
        description: Скидка на позицию.
        data_tests: [not_null, non_negative]
      - name: line_amount
        description: Сумма позиции после скидки.
        data_tests: [not_null, non_negative]
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

  - name: dim_customers
    description: Одна строка - клиент, включая клиентов без покупок.
    columns:
      - name: customer_id
        description: Номер клиента.
        data_tests: [unique, not_null]
      - name: registered_at
        description: Время регистрации.
      - name: registration_date
        description: Дата регистрации.
      - name: city
        description: Город.
      - name: acquisition_channel
        description: Канал привлечения.
      - name: first_confirmed_order_id
        description: Номер первой подтверждённой покупки.
      - name: first_confirmed_at
        description: Время первой подтверждённой покупки.
      - name: confirmed_orders_count
        description: Число подтверждённых покупок.
        data_tests: [not_null, non_negative]
      - name: confirmed_revenue
        description: Сумма подтверждённых покупок.
        data_tests: [not_null, non_negative]
      - name: is_buyer
        description: Есть подтверждённая покупка.
        data_tests: [not_null]

  - name: dim_products
    description: Одна строка - товар.
    columns:
      - name: product_id
        description: Номер товара.
        data_tests: [unique, not_null]
      - name: product_name
        description: Название товара.
      - name: brand
        description: Бренд.
      - name: category_name
        description: Категория.
        data_tests: [not_null]
      - name: parent_category_name
        description: Родительская категория.
      - name: root_category_name
        description: Корневая категория.
        data_tests: [not_null]

  - name: dim_dates
    description: Одна строка - день.
    columns:
      - name: date_day
        description: Дата.
        data_tests: [unique, not_null]
      - name: year_number
        description: Год.
      - name: quarter_number
        description: Квартал.
      - name: month_number
        description: Месяц.
      - name: day_of_week
        description: 'День недели: 1 - пн, 7 - вс.'
      - name: is_weekend
        description: Суббота или воскресенье.
        data_tests: [not_null]
